<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tâchtik — Indicateurs</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    :root {
      --text: #17324d;
      --muted: #6f7f8f;
      --border: #e7edf3;
      --card: #ffffff;
      --shadow: 0 6px 18px rgba(24, 50, 77, 0.08);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Arial, sans-serif;
      background: transparent;
      color: var(--text);
    }
    body { padding: 10px; }
    .dashboard {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      width: 100%;
    }
    .kpi {
      position: relative;
      min-height: 96px;
      padding: 14px 16px 14px 18px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      overflow: hidden;
    }
    .kpi::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      background: var(--accent);
    }
    .left {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }
    .icon {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--soft);
      font-size: 19px;
    }
    .texts { min-width: 0; }
    .label {
      font-size: 14px;
      font-weight: 750;
      line-height: 1.15;
      color: #40586f;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sub {
      margin-top: 4px;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }
    .value {
      flex: 0 0 auto;
      font-size: clamp(30px, 3vw, 42px);
      line-height: 1;
      font-weight: 850;
      letter-spacing: -0.045em;
      color: var(--accent);
    }
    .all  { --accent: #2f6fdd; --soft: #edf4ff; }
    .late { --accent: #d83a4a; --soft: #fff0f2; }
    .soon { --accent: #e59616; --soft: #fff6e5; }
    .done { --accent: #2f9b67; --soft: #edf8f2; }

    .message {
      display: none;
      min-height: 80px;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 16px;
    }

    @media (max-width: 760px) {
      .dashboard { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 420px) {
      body { padding: 8px; }
      .dashboard { grid-template-columns: 1fr; gap: 8px; }
      .kpi { min-height: 84px; }
    }
  </style>
</head>

<body>
  <main id="dashboard" class="dashboard">
    <section class="kpi all">
      <div class="left">
        <div class="icon">📋</div>
        <div class="texts">
          <div class="label">À traiter</div>
          <div class="sub">Contributions actives</div>
        </div>
      </div>
      <div id="kpi-total" class="value">0</div>
    </section>

    <section class="kpi late">
      <div class="left">
        <div class="icon">⏰</div>
        <div class="texts">
          <div class="label">En retard</div>
          <div class="sub">Échéance dépassée</div>
        </div>
      </div>
      <div id="kpi-late" class="value">0</div>
    </section>

    <section class="kpi soon">
      <div class="left">
        <div class="icon">⚡</div>
        <div class="texts">
          <div class="label">Moins de 7 jours</div>
          <div class="sub">Échéance proche</div>
        </div>
      </div>
      <div id="kpi-soon" class="value">0</div>
    </section>

    <section class="kpi done">
      <div class="left">
        <div class="icon">✅</div>
        <div class="texts">
          <div class="label">Terminées</div>
          <div class="sub">Contributions finalisées</div>
        </div>
      </div>
      <div id="kpi-done" class="value">0</div>
    </section>
  </main>

  <div id="message" class="message">En attente des données Grist…</div>

  <script>
    const dashboard = document.getElementById("dashboard");
    const message = document.getElementById("message");
    const elTotal = document.getElementById("kpi-total");
    const elLate = document.getElementById("kpi-late");
    const elSoon = document.getElementById("kpi-soon");
    const elDone = document.getElementById("kpi-done");

    function normalize(text) {
      return String(text || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function numberValue(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n : 0;
    }

    function findCount(records, words) {
      const row = records.find(r => {
        const label = normalize(r.Indicateur);
        return words.every(word => label.includes(word));
      });
      return row ? numberValue(row.Nombre) : 0;
    }

    function render(records) {
      records = Array.isArray(records) ? records : [];
      const late = findCount(records, ["retard"]);
      const under7 = findCount(records, ["moins", "7", "jour"]);
      const under15 = findCount(records, ["moins", "15", "jour"]);
      const upcoming = findCount(records, ["venir"]);
      const done = findCount(records, ["fait"]);

      elTotal.textContent = late + under7 + under15 + upcoming;
      elLate.textContent = late;
      elSoon.textContent = under7;
      elDone.textContent = done;

      dashboard.style.display = "grid";
      message.style.display = "none";
    }

    function showError(text) {
      dashboard.style.display = "none";
      message.style.display = "flex";
      message.textContent = text;
    }

    try {
      grist.ready({ requiredAccess: "read table" });
      grist.onRecords(records => {
        try {
          render(records);
        } catch (err) {
          console.error(err);
          showError("Impossible d’afficher les indicateurs.");
        }
      });
    } catch (err) {
      console.error(err);
      showError("Le widget doit être ouvert depuis Grist.");
    }
  </script>
</body>
</html>
