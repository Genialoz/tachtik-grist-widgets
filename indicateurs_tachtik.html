<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tâchtik — Indicateurs</title>

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

  <style>
    :root {
      --bg: #f5f8fc;
      --card: #ffffff;
      --text: #18324a;
      --muted: #6f8091;
      --border: #e5ebf1;
      --shadow: 0 8px 24px rgba(31, 55, 78, 0.08);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      padding: 14px;
    }

    .dashboard {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .kpi {
      position: relative;
      overflow: hidden;
      min-height: 138px;
      padding: 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .kpi::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      background: var(--accent);
    }

    .kpi-header {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      font-size: 20px;
      background: var(--soft);
    }

    .label {
      font-size: 14px;
      font-weight: 700;
      color: #52677a;
      line-height: 1.2;
    }

    .value-line {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 15px;
    }

    .value {
      font-size: clamp(34px, 4vw, 48px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--text);
    }

    .unit {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    .all {
      --accent: #2d6cdf;
      --soft: #eef4ff;
    }

    .late {
      --accent: #dc3545;
      --soft: #fff0f2;
    }

    .soon {
      --accent: #f39c12;
      --soft: #fff7e8;
    }

    .done {
      --accent: #2e9d65;
      --soft: #ecf8f1;
    }

    .message {
      width: 100%;
      min-height: 120px;
      display: none;
      place-items: center;
      text-align: center;
      padding: 22px;
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 900px) {
      .dashboard {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      .dashboard {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .kpi {
        min-height: 118px;
      }
    }
  </style>
</head>

<body>
  <div id="dashboard" class="dashboard">
    <section class="kpi all">
      <div class="kpi-header">
        <div class="icon">📋</div>
        <div class="label">À traiter</div>
      </div>
      <div class="value-line">
        <div id="kpi-total" class="value">0</div>
        <div class="unit">contribution(s)</div>
      </div>
    </section>

    <section class="kpi late">
      <div class="kpi-header">
        <div class="icon">⏰</div>
        <div class="label">En retard</div>
      </div>
      <div class="value-line">
        <div id="kpi-late" class="value">0</div>
        <div class="unit">contribution(s)</div>
      </div>
    </section>

    <section class="kpi soon">
      <div class="kpi-header">
        <div class="icon">⚡</div>
        <div class="label">Moins de 7 jours</div>
      </div>
      <div class="value-line">
        <div id="kpi-soon" class="value">0</div>
        <div class="unit">contribution(s)</div>
      </div>
    </section>

    <section class="kpi done">
      <div class="kpi-header">
        <div class="icon">✓</div>
        <div class="label">Terminées</div>
      </div>
      <div class="value-line">
        <div id="kpi-done" class="value">0</div>
        <div class="unit">contribution(s)</div>
      </div>
    </section>
  </div>

  <div id="message" class="message">
    En attente des données Grist…
  </div>

  <script>
    const dashboard = document.getElementById("dashboard");
    const message = document.getElementById("message");

    const elTotal = document.getElementById("kpi-total");
    const elLate = document.getElementById("kpi-late");
    const elSoon = document.getElementById("kpi-soon");
    const elDone = document.getElementById("kpi-done");

    function normalize(text) {
      return String(text || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function numberValue(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n : 0;
    }

    function findCount(records, words) {
      const row = records.find(r => {
        const label = normalize(r.Indicateur);
        return words.every(word => label.includes(word));
      });
      return row ? numberValue(row.Nombre) : 0;
    }

    function render(records) {
      if (!Array.isArray(records)) {
        records = [];
      }

      const late = findCount(records, ["retard"]);
      const under7 = findCount(records, ["moins", "7", "jour"]);
      const under15 = findCount(records, ["moins", "15", "jour"]);
      const upcoming = findCount(records, ["venir"]);
      const done = findCount(records, ["fait"]);

      // Toutes les alertes actives constituent les contributions "À traiter".
      const totalActive = late + under7 + under15 + upcoming;

      elTotal.textContent = totalActive;
      elLate.textContent = late;
      elSoon.textContent = under7;
      elDone.textContent = done;

      dashboard.style.display = "grid";
      message.style.display = "none";
    }

    function showError(text) {
      dashboard.style.display = "none";
      message.style.display = "grid";
      message.textContent = text;
    }

    try {
      grist.ready({ requiredAccess: "read table" });

      grist.onRecords(function(records) {
        try {
          render(records);
        } catch (err) {
          console.error(err);
          showError("Impossible d’afficher les indicateurs.");
        }
      });
    } catch (err) {
      console.error(err);
      showError("Le widget doit être ouvert depuis Grist.");
    }
  </script>
</body>
</html>
