<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tâchtik - Synthèses</title>

<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

<style>
  :root{
    --bg:#f6f8fb;
    --card:#ffffff;
    --text:#1f2937;
    --muted:#6b7280;
    --line:#e5e7eb;
    --primary:#2563eb;
    --primary-soft:#eff6ff;
    --danger:#b91c1c;
    --danger-soft:#fef2f2;
    --warning:#b45309;
    --warning-soft:#fffbeb;
    --success:#047857;
    --success-soft:#ecfdf5;
    --shadow:0 10px 30px rgba(31,41,55,.08);
    --radius:18px;
  }

  *{
    box-sizing:border-box;
  }

  body{
    margin:0;
    font-family:
      Inter,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
    background:var(--bg);
    color:var(--text);
  }

  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:24px;
  }

  .hero{
    background:
      linear-gradient(
        135deg,
        #1d4ed8,
        #3b82f6
      );
    color:#fff;
    border-radius:22px;
    padding:24px 26px;
    box-shadow:var(--shadow);
    margin-bottom:20px;
  }

  .hero h1{
    margin:0 0 6px;
    font-size:28px;
  }

  .hero p{
    margin:0;
    opacity:.92;
  }

  .meta{
    margin-top:12px;
    font-size:13px;
    opacity:.9;
  }

  .grid-kpi{
    display:grid;
    grid-template-columns:
      repeat(
        4,
        minmax(0,1fr)
      );
    gap:14px;
    margin-bottom:20px;
  }

  .kpi{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
    box-shadow:var(--shadow);
  }

  .kpi .label{
    font-size:13px;
    color:var(--muted);
    margin-bottom:8px;
  }

  .kpi .value{
    font-size:30px;
    font-weight:800;
  }

  .kpi.danger{
    background:var(--danger-soft);
  }

  .kpi.warning{
    background:var(--warning-soft);
  }

  .kpi.success{
    background:var(--success-soft);
  }

  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    box-shadow:var(--shadow);
    margin-bottom:18px;
  }

  .panel h2{
    margin:0 0 14px;
    font-size:20px;
  }

  .controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    margin-bottom:16px;
  }

  .options-box{
    border:1px solid var(--line);
    border-radius:14px;
    background:#fafafa;
    padding:14px 16px;
    margin-bottom:16px;
  }

  .options-title{
    font-weight:800;
    margin-bottom:10px;
  }

  .options-row{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    align-items:center;
  }

  .check{
    display:flex;
    gap:7px;
    align-items:center;
    font-size:14px;
  }

  .check input{
    width:17px;
    height:17px;
  }

  .select-wrap{
    display:flex;
    gap:8px;
    align-items:center;
    font-size:14px;
  }

  .select-wrap select{
    border:1px solid var(--line);
    border-radius:10px;
    padding:8px 10px;
    background:#fff;
    font:inherit;
  }

  button{
    border:0;
    border-radius:12px;
    padding:11px 15px;
    font-weight:700;
    cursor:pointer;
    background:#eef2f7;
    color:#111827;
  }

  button.primary{
    background:var(--primary);
    color:#fff;
  }

  button:hover{
    filter:brightness(.98);
  }

  button:disabled{
    opacity:.5;
    cursor:not-allowed;
  }

  .status{
    min-height:22px;
    margin:4px 0 12px;
    font-size:14px;
    color:var(--success);
    font-weight:700;
  }

  .mail-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }

  .field label{
    display:block;
    font-size:12px;
    font-weight:700;
    color:var(--muted);
    margin-bottom:6px;
  }

  .field input,
  .field textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:12px;
    padding:11px 12px;
    font:inherit;
    background:#fff;
    color:var(--text);
  }

  .field textarea{
    min-height:420px;
    resize:vertical;
    white-space:pre-wrap;
  }

  .preview{
    border:1px solid var(--line);
    border-radius:14px;
    background:#fafafa;
    padding:16px;
    white-space:pre-wrap;
    min-height:420px;
    line-height:1.5;
  }

  .hidden{
    display:none !important;
  }

  @media(max-width:800px){

    .grid-kpi{
      grid-template-columns:
        repeat(2,1fr);
    }

    .mail-grid{
      grid-template-columns:1fr;
    }

    .select-wrap{
      width:100%;
      justify-content:space-between;
    }

    .select-wrap select{
      max-width:60%;
    }
  }
</style>
</head>


<body>

<div class="wrap">

  <!-- =====================================
       ENTÊTE
       ===================================== -->

  <section class="hero">

    <h1>📊 Synthèses</h1>

    <p>
      Générez une synthèse des contributions à traiter,
      prête à être copiée ou ouverte dans votre messagerie.
    </p>

    <div
      id="scopeMeta"
      class="meta"
    >
      Chargement du périmètre…
    </div>

  </section>


  <div
    id="errorBox"
    class="error hidden"
  ></div>


  <!-- =====================================
       KPI
       ===================================== -->

  <section class="grid-kpi">

    <div class="kpi">
      <div class="label">
        À traiter
      </div>
      <div

        class="value"
      >
        0

    </div>


    <div class="kpi danger">
      <div class="label">
        En retard
      </div>
      <div
        id="kpiLate"
        class="value"
      >
        0
      </div>
    </div>


    <div class="kpi warning">
      <div class="label">
        À relancer
      </div>
      <div
        id="kpiReminder"
        class="value"
      >
        0
      </div>
    </div>


    <div class="kpi success">
      <div class="label">
        Urgentes
      </div>
      <div
        id="kpiUrgent"
        class="value"
      >
        0
      </div>
    </div>

  </section>


  <!-- =====================================
       PRÉPARATION
       ===================================== -->

  <section class="panel">

    <h2>
      ✉️ Préparer la synthèse
    </h2>


    <!-- =====================================
         CONTENU
         ===================================== -->

    <div class="options-box">

      <div class="options-title">
        Contenu de la synthèse
      </div>

      <div class="options-row">

        <label class="check">

          <input
            type="checkbox"
            id="includeLate"
            checked
          >

          Contributions en retard

        </label>


        <label class="check">

          <input
            type="checkbox"
            id="includeReminders"
            checked
          >

          Contributions à relancer

        </label>


        <label class="check">

          <input
            type="checkbox"
            id="includeUpcoming"
            checked
          >

          Prochaines échéances

        </label>


        <label class="select-wrap">

          Période des prochaines échéances

          <select id="upcomingDays">

            <option value="7">
              7 jours
            </option>

            <option
              value="15"
              selected
            >
              15 jours
            </option>

            <option value="30">
              30 jours
            </option>

            <option value="all">
              Toutes
            </option>

          </select>

        </label>

      </div>

    </div>


    <!-- =====================================
         FILTRES
         ===================================== -->

    <div class="options-box">

      <div class="options-title">
        🔎 Filtrer la synthèse
      </div>

      <div class="options-row">


        <!--
          NOUVEAU v62 :
          bureau d'origine.

          Ce filtre sera masqué automatiquement
          pour les profils qui ne sont ni
          Administrateur ni Gestionnaire E1.
        -->

        <label
          class="select-wrap hidden"
          id="bureauFilterWrap"
        >

          Bureau d'origine

          <select id="filterBureau">

            <option value="">
              Tous les bureaux
            </option>

          </select>

        </label>


        <label class="select-wrap">

          Département

          <select id="filterDepartment">

            <option value="">
              Tous les départements
            </option>

          </select>

        </label>


        <label class="select-wrap">

          Priorité

          <select id="filterPriority">

            <option value="">
              Toutes les priorités
            </option>

          </select>

        </label>


        <label class="select-wrap">

          Demandeur

          <select id="filterRequester">

            <option value="">
              Tous les demandeurs
            </option>

          </select>

        </label>


        <label class="select-wrap">

          Type

          <select id="filterType">

            <option value="">
              Toutes les contributions à traiter
            </option>

            <option value="late">
              En retard uniquement
            </option>

            <option value="reminder">
              À relancer uniquement
            </option>

            <option value="urgent">
              Urgentes uniquement
            </option>

          </select>

        </label>


        <button
          id="resetFiltersBtn"
          type="button"
        >
          ↺ Réinitialiser les filtres
        </button>

      </div>

    </div>


    <!-- =====================================
         ACTIONS
         ===================================== -->

    <div class="controls">

      <button
        class="primary"
        id="refreshBtn"
      >
        🔄 Actualiser
      </button>

      <button id="copyBtn">
        📋 Copier la synthèse
      </button>

      <button id="mailtoBtn">
        📨 Ouvrir dans la messagerie
      </button>

    </div>


    <div
      id="status"
      class="status"
    ></div>


    <!-- =====================================
         DESTINATAIRES
         ===================================== -->

    <div
      class="field"
      style="margin-bottom:14px"
    >

      <label>
        Destinataires
      </label>

      <input
        id="recipients"
        type="text"
        placeholder="ex. bureau-e1@..."
      >

    </div>


    <!-- =====================================
         OBJET
         ===================================== -->

    <div
      class="field"
      style="margin-bottom:14px"
    >

      <label>
        Objet
      </label>

      <input
        id="subject"
        type="text"
      >

    </div>


    <!-- =====================================
         MESSAGE + APERÇU
         ===================================== -->

    <div class="mail-grid">

      <div class="field">

        <label>
          Message généré
        </label>

        <textarea id="body"></textarea>

      </div>


      <div class="field">

        <label>
          Aperçu
        </label>

        <div
          id="preview"
          class="preview"
        ></div>

      </div>

    </div>

  </section>

</div>


<script>

"use strict";


/* =========================================
   OUTILS
   ========================================= */

const $ =
  (id) =>
    document.getElementById(id);



let state = {

  user:null,

  profile:null,

  bureauId:null,

  bureauCode:"",

  role:"",

  params:null,

  bureaux:[],

  contributions:[],

  filtered:[]

};



/* =========================================
   ERREURS
   ========================================= */

function showError(err){

  const box =
    $("errorBox");

  box.textContent =
    "Erreur : "
    +
    (
      err?.message
      ||
      String(err)
    );

  box.classList.remove(
    "hidden"
  );

}



function clearError(){

  $("errorBox")
    .classList
    .add(
      "hidden"
    );

}



/* =========================================
   NORMALISATION
   ========================================= */

function normalizeText(v){

  return String(
    v ?? ""
  )
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    );

}



/* =========================================
   PROFILS
   ========================================= */

function hasGlobalAccess(){

  return (
    state.role === "Administrateur"
    ||
    state.role === "Gestionnaire E1"
  );

}



/* =========================================
   STATUTS
   ========================================= */

function isDone(rec){

  return (
    normalizeText(
      rec.Statut
    )
    ===
    normalizeText(
      "Fait"
    )
  );

}



function isUrgent(rec){

  return (
    normalizeText(
      rec.Priorite
    )
    ===
    normalizeText(
      "Urgente"
    )
  );

}



function isReminder(rec){

  return normalizeText(
    rec.Rappel_a_faire
  )
    .includes(
      "relancer"
    );

}



/* =========================================
   DATES
   ========================================= */

function gristDateToDate(v){

  if(
    v === null
    ||
    v === undefined
    ||
    v === ""
  ){
    return null;
  }


  if(
    v instanceof Date
  ){
    return v;
  }


  const n =
    Number(v);


  if(
    Number.isFinite(n)
  ){

    return new Date(
      n * 1000
    );

  }


  const d =
    new Date(v);


  return Number.isNaN(
    d.getTime()
  )
    ? null
    : d;

}



function formatDate(v){

  const d =
    gristDateToDate(v);


  if(!d){
    return "";
  }


  return new Intl.DateTimeFormat(
    "fr-FR",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  )
  .format(d);

}



function todayFr(){

  return new Intl.DateTimeFormat(
    "fr-FR",
    {
      day:"numeric",
      month:"long",
      year:"numeric"
    }
  )
  .format(
    new Date()
  );

}



/* =========================================
   TABLES GRIST
   ========================================= */

function rowsFromTable(t){

  if(
    !t
    ||
    !t.id
  ){
    return [];
  }


  const n =
    t.id.length;


  const rows =
    [];


  for(
    let i=0;
    i<n;
    i++
  ){

    const row =
      {};


    for(
      const [key,value]
      of Object.entries(t)
    ){

      row[key] =
        Array.isArray(value)
          ? value[i]
          : value;

    }


    rows.push(
      row
    );

  }


  return rows;

}



async function safeFetch(name){

  try{

    return rowsFromTable(
      await grist.docApi.fetchTable(
        name
      )
    );

  }
  catch(error){

    console.warn(
      "Table inaccessible :",
      name,
      error
    );

    return [];

  }

}



/* =========================================
   UTILISATEUR COURANT
   ========================================= */

async function resolveCurrentUser(){

  /*
    Méthode utilisée par Tâchtik :

    une ligne temporaire est créée
    dans SESSION_WIDGET afin que les
    trigger formulas Grist déterminent
    l'utilisateur courant.
  */

  const actions = [
    [
      "AddRecord",
      "SESSION_WIDGET",
      null,
      {}
    ]
  ];


  const result =
    await grist.docApi
      .applyUserActions(
        actions
      );


  let newId =
    null;


  if(
    Array.isArray(result)
  ){

    for(
      const item
      of result
    ){

      if(
        Array.isArray(item)
        &&
        item[0] === "AddRecord"
      ){

        newId =
          item[2];

      }

    }

  }


  const sessions =
    await safeFetch(
      "SESSION_WIDGET"
    );


  let row =
    null;


  if(newId){

    row =
      sessions.find(
        r =>
          Number(r.id)
          ===
          Number(newId)
      );

  }


  if(
    !row
    &&
    sessions.length
  ){

    row =
      sessions[
        sessions.length - 1
      ];

  }


  /*
    Suppression de la ligne temporaire.
  */

  if(row?.id){

    try{

      await grist.docApi
        .applyUserActions([
          [
            "BulkRemoveRecord",
            "SESSION_WIDGET",
            [row.id]
          ]
        ]);

    }
    catch(error){

      console.warn(
        "Nettoyage SESSION_WIDGET impossible",
        error
      );

    }

  }


  return row || null;

}



/* =========================================
   AFFICHAGE D'UNE CONTRIBUTION
   ========================================= */

function contributionLine(r){

  const num =
    r.Numero
    ||
    "";


  const title =
    r.Titre
    ||
    "(Sans titre)";


  const contributor =
    r.Contributeur_code
    ||
    r.Contributeur_label
    ||
    r.Contributeur
    ||
    "";


  const due =
    formatDate(
      r.Echeance
    );


  const parts =
    [
      num,
      title
    ];


  if(contributor){

    parts.push(
      String(
        contributor
      )
    );

  }


  if(due){

    parts.push(
      "échéance "
      +
      due
    );

  }


  return parts
    .filter(Boolean)
    .join(
      " – "
    );

}



/* =========================================
   TRI ÉCHÉANCE
   ========================================= */

function sortByDue(a,b){

  const da =
    gristDateToDate(
      a.Echeance
    );


  const db =
    gristDateToDate(
      b.Echeance
    );


  if(
    !da
    &&
    !db
  ){
    return 0;
  }


  if(!da){
    return 1;
  }


  if(!db){
    return -1;
  }


  return da - db;

}



/* =========================================
   VALEURS UNIQUES DES FILTRES
   ========================================= */

function uniqueSortedValues(values){

  return [
    ...new Set(

      values
        .map(
          value =>
            String(
              value ?? ""
            )
            .trim()
        )
        .filter(Boolean)

    )
  ]
  .sort(
    (a,b) =>
      a.localeCompare(
        b,
        "fr",
        {
          sensitivity:"base"
        }
      )
  );

}



/* =========================================
   REMPLISSAGE D'UN SELECT
   ========================================= */

function fillFilterSelect(
  selectId,
  values,
  emptyLabel
){

  const select =
    $(selectId);


  const previousValue =
    select.value;


  select.innerHTML =
    "";


  const emptyOption =
    document.createElement(
      "option"
    );


  emptyOption.value =
    "";


  emptyOption.textContent =
    emptyLabel;


  select.appendChild(
    emptyOption
  );


  values.forEach(
    value => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        value;


      option.textContent =
        value;


      select.appendChild(
        option
      );

    }
  );


  const stillExists =
    [
      ...select.options
    ]
    .some(
      option =>
        option.value
        ===
        previousValue
    );


  if(
    previousValue
    &&
    stillExists
  ){

    select.value =
      previousValue;

  }

}



/* =========================================
   NOUVEAU v62
   BUREAU D'ORIGINE
   ========================================= */

function bureauLabelFromId(id){

  const bureau =
    state.bureaux.find(
      b =>
        Number(b.id)
        ===
        Number(id)
    );


  if(!bureau){
    return "";
  }


  return (
    bureau.Code
    ||
    bureau.Nom
    ||
    String(id)
  );

}



function populateBureauFilter(){

  const wrap =
    $("bureauFilterWrap");


  /*
    Ce filtre n'a d'intérêt que
    pour les profils ayant accès
    à plusieurs bureaux.
  */

  if(
    !hasGlobalAccess()
  ){

    wrap.classList.add(
      "hidden"
    );

    $("filterBureau").value =
      "";

    return;

  }


  wrap.classList.remove(
    "hidden"
  );


  const todo =
    state.filtered.filter(
      r =>
        !isDone(r)
    );


  /*
    On récupère uniquement les bureaux
    qui ont effectivement au moins
    une contribution dans le périmètre.
  */

  const bureauIds =
    [
      ...new Set(
        todo
          .map(
            r =>
              Number(
                r.Bureau_origine
              )
          )
          .filter(
            id =>
              Number.isFinite(id)
              &&
              id > 0
          )
      )
    ];


  const values =
    bureauIds
      .map(
        id => ({
          id,
          label:
            bureauLabelFromId(id)
            ||
            String(id)
        })
      )
      .sort(
        (a,b) =>
          a.label.localeCompare(
            b.label,
            "fr",
            {
              sensitivity:"base"
            }
          )
      );


  const select =
    $("filterBureau");


  const previousValue =
    select.value;


  select.innerHTML =
    "";


  const allOption =
    document.createElement(
      "option"
    );


  allOption.value =
    "";


  allOption.textContent =
    "Tous les bureaux";


  select.appendChild(
    allOption
  );


  values.forEach(
    bureau => {

      const option =
        document.createElement(
          "option"
        );


      /*
        On stocke l'ID Grist,
        mais on affiche le code métier.
      */

      option.value =
        String(
          bureau.id
        );


      option.textContent =
        bureau.label;


      select.appendChild(
        option
      );

    }
  );


  if(
    previousValue
    &&
    [
      ...select.options
    ]
    .some(
      option =>
        option.value
        ===
        previousValue
    )
  ){

    select.value =
      previousValue;

  }

}



/* =========================================
   AUTRES FILTRES
   ========================================= */

function populateSynthFilters(){

  const todo =
    state.filtered.filter(
      r =>
        !isDone(r)
    );


  populateBureauFilter();


  const departments =
    uniqueSortedValues(
      todo.map(
        r =>
          r.Contributeur_code
      )
    );


  const priorities =
    uniqueSortedValues(
      todo.map(
        r =>
          r.Priorite
      )
    );


  const requesters =
    uniqueSortedValues(
      todo.map(
        r =>
          r.Demandeur
      )
    );


  fillFilterSelect(
    "filterDepartment",
    departments,
    "Tous les départements"
  );


  fillFilterSelect(
    "filterPriority",
    priorities,

    requesters,

}



/* =========================================
   APPLICATION DES FILTRES
   ========================================= */

function getFilteredContributions(){

  const bureauId =
    $("filterBureau")
      .value;


  const department =
    $("filterDepartment")
      .value;


  const priority =
    $("filterPriority")
      .value;


  const requester =
    $("filterRequester")
      .value;


  const type =
    $("filterType")
      .value;


  /*
    IMPORTANT :

    on repart toujours de state.filtered.

    Les filtres ne peuvent donc jamais
    élargir les droits de l'utilisateur.
  */

  let rows =
    state.filtered.filter(
      r =>
        !isDone(r)
    );


  /* Bureau d'origine */

  if(
    hasGlobalAccess()
    &&
    bureauId
  ){

    rows =
      rows.filter(
        r =>
          Number(
            r.Bureau_origine
          )
          ===
          Number(
            bureauId
          )
      );

  }


  /* Département */

  if(department){

    rows =
      rows.filter(
        r =>
          normalizeText(
            r.Contributeur_code
          )
          ===
          normalizeText(
            department
          )
      );

  }


  /* Priorité */

  if(priority){

    rows =
      rows.filter(
        r =>
          normalizeText(
            r.Priorite
          )
          ===
          normalizeText(
            priority
          )
      );

  }


  /* Demandeur */

  if(requester){

    rows =
      rows.filter(
        r =>
          normalizeText(
            r.Demandeur
          )
          ===
          normalizeText(
            requester
          )
      );

  }


  /* En retard */

  if(
    type === "late"
  ){

    rows =
      rows.filter(
        r => {

          const days =
            Number(
              r.Jours_restants
            );


          return (
            Number.isFinite(days)
            &&
            days < 0
          );

        }
      );

  }


  /* À relancer */

  if(
    type === "reminder"
  ){

    rows =
      rows.filter(
        isReminder
      );

  }


  /* Urgente */

  if(
    type === "urgent"
  ){

    rows =
      rows.filter(
        isUrgent
      );

  }


  return rows;

}



/* =========================================
   DONNÉES COURANTES
   ========================================= */

function currentData(){

  const todo =
    getFilteredContributions();


  const late =
    todo
      .filter(
        r => {

          const days =
            Number(
              r.Jours_restants
            );


          return (
            Number.isFinite(days)
            &&
            days < 0
          );

        }
      )
      .sort(
        sortByDue
      );


  const reminders =
    todo
      .filter(
        isReminder
      )
      .sort(
        sortByDue
      );


  const urgent =
    todo
      .filter(
        isUrgent
      )
      .sort(
        sortByDue
      );


  return {
    todo,
    late,
    reminders,
    urgent
  };

}



/* =========================================
   PROCHAINES ÉCHÉANCES
   ========================================= */

function getUpcoming(data){

  const choice =
    $("upcomingDays")
      .value;


  const now =
    new Date();


  now.setHours(
    0,
    0,
    0,
    0
  );


  return data.todo

    .filter(
      r =>
        !data.late.includes(r)
    )

    .filter(
      r =>
        r.Echeance
    )

    .filter(
      r => {

        if(
          choice === "all"
        ){
          return true;
        }


        const date =
          gristDateToDate(
            r.Echeance
          );


        if(!date){
          return false;
        }


        date.setHours(
          0,
          0,
          0,
          0
        );


        const diff =
          Math.ceil(
            (
              date - now
            )
            /
            86400000
          );


        return (
          diff >= 0
          &&
          diff <= Number(choice)
        );

      }
    )

    .sort(
      sortByDue
    );

}



/* =========================================
   CORPS PAR DÉFAUT
   ========================================= */

function buildDefaultBody(data){

  const lines =
    [];


  lines.push(
    "Bonjour,"
  );


  lines.push(
    ""
  );


  lines.push(
    `Voici la synthèse des contributions au ${todayFr()}.`
  );


  lines.push(
    ""
  );


  lines.push(
    `${data.todo.length} contribution(s) à traiter`
  );


  lines.push(
    `- ${data.late.length} en retard`
  );


  lines.push(
    `- ${data.reminders.length} à relancer`
  );


  lines.push(
    `- ${data.urgent.length} urgente(s)`
  );


  lines.push(
    ""
  );


  if(
    $("includeLate").checked
    &&
    data.late.length
  ){

    lines.push(
      "🔴 Contributions en retard"
    );


    data.late.forEach(
      r =>
        lines.push(
          "• "
          +
          contributionLine(r)
        )
    );


    lines.push(
      ""
    );

  }


  if(
    $("includeReminders").checked
    &&
    data.reminders.length
  ){

    lines.push(
      "🔔 Contributions à relancer"
    );


    data.reminders.forEach(
      r =>
        lines.push(
          "• "
          +
          contributionLine(r)
        )
    );


    lines.push(
      ""
    );

  }


  const upcoming =
    getUpcoming(
      data
    );


  if(
    $("includeUpcoming").checked
    &&
    upcoming.length
  ){

    lines.push(
      "📅 Prochaines échéances"
    );


    upcoming.forEach(
      r =>
        lines.push(
          "• "
          +
          contributionLine(r)
        )
    );


    lines.push(
      ""
    );

  }


  lines.push(
    "Bien cordialement,"
  );


  lines.push(
    ""
  );


  lines.push(
    state.params?.Nom_signature
    ||
    state.bureauCode
    ||
    ""
  );


  return lines.join(
    "\n"
  );

}



/* =========================================
   BLOCS DE DÉTAIL
   ========================================= */

function detailBlock(list){

  return list.length

    ? list
        .map(
          r =>
            "• "
            +
            contributionLine(r)
        )
        .join(
          "\n"
        )

    : "Aucune";

}



/* =========================================
   NETTOYAGE MODÈLE
   ========================================= */

function cleanEmptyLines(text){

  return String(
    text ?? ""
  )

    .split(
      "\n"
    )

    .filter(
      line => {

        const trimmed =
          line.trim();


        if(!trimmed){
          return true;
        }


        if(
          /^[^:\n]+:\s*$/
            .test(
              trimmed
            )
        ){
          return false;
        }


        return true;

      }
    )

    .join(
      "\n"
    )

    .replace(
      /\n{3,}/g,
      "\n\n"
    )

    .trim();

}



/* =========================================
   MODÈLE DE MAIL
   ========================================= */

function renderTemplate(
  template,
  data
){

  if(!template){

    return buildDefaultBody(
      data
    );

  }


  const upcoming =
    getUpcoming(
      data
    );


  const vars = {

    "[DATE]":
      todayFr(),

    "[NB_A_TRAITER]":
      String(
        data.todo.length
      ),

    "[NB_EN_RETARD]":
      String(
        data.late.length
      ),

    "[NB_A_RELANCER]":
      String(
        data.reminders.length
      ),

    "[NB_URGENTES]":
      String(
        data.urgent.length
      ),

    "[DETAIL_EN_RETARD]":
      $("includeLate").checked
        ? detailBlock(
            data.late
          )
        : "",

    "[DETAIL_A_RELANCER]":
      $("includeReminders").checked
        ? detailBlock(
            data.reminders
          )
        : "",

    "[DETAIL_PROCHAINES]":
      $("includeUpcoming").checked
        ? detailBlock(
            upcoming
          )
        : "",

    "[NOM_SIGNATURE]":
      state.params?.Nom_signature
      ||
      state.bureauCode
      ||
      "",

    "[EMAIL_CONTACT]":
      state.params?.Email_contact
      ||
      ""

  };


  let out =
    String(
      template
    );


  for(
    const [key,value]
    of Object.entries(vars)
  ){

    out =
      out
        .split(key)
        .join(value);

  }


  if(
    !$("includeLate").checked
  ){

    out =
      out.replace(
        /^.*Contributions en retard.*\n?/gmi,
        ""
      );

  }


  if(
    !$("includeReminders").checked
  ){

    out =
      out.replace(
        /^.*Contributions à relancer.*\n?/gmi,
        ""
      );

  }


  if(
    !$("includeUpcoming").checked
  ){

    out =
      out.replace(
        /^.*Prochaines échéances.*\n?/gmi,
        ""
      );

  }


  return cleanEmptyLines(
    out
  );

}

/* =========================================
   CHARGEMENT
   ========================================= */

async function load(){

  clearError();


  $("status")
    .textContent =
      "Chargement…";


  try{


    state.user =
      await resolveCurrentUser();


    const [
      users,
      bureaux,
      params,
      contribs,
      depts
    ] =
      await Promise.all([

        safeFetch(
          "UTILISATEURS"
        ),

        safeFetch(
          "BUREAUX_ORIGINE"
        ),

        safeFetch(
          "PARAMETRES_BUREAUX"
        ),

        safeFetch(
          "CONTRIBUTIONS"
        ),

        safeFetch(
          "DEPARTEMENTS"
        )

      ]);


    state.bureaux =
      bureaux;


    const email =
      state.user?.Email
      ||
      "";


    state.profile =
      users.find(
        u =>
          normalizeText(
            u.Email
          )
          ===
          normalizeText(
            email
          )
      )
      ||
      null;


    state.bureauId =
      state.profile?.Bureau
      ||
      state.user?.Bureau
      ||
      null;


    const bureau =
      bureaux.find(
        b =>
          Number(b.id)
          ===
          Number(
            state.bureauId
          )
      );


    state.bureauCode =
      bureau?.Code
      ||
      "";


    /*
      Rôle courant.
    */

    state.role =
      state.profile?.Role
      ||
      state.user?.Role
      ||
      "";


    /*
      Référentiel départements.
    */

    const deptMap =
      new Map(

        depts.map(
          d => [

            Number(d.id),

            d.Code
            ||
            d.Nom
            ||
            ""

          ]
        )

      );


    /*
      Enrichissement des contributions.
    */

    state.contributions =
      contribs.map(
        r => ({

          ...r,

          Contributeur_code:
            deptMap.get(
              Number(
                r.Contributeur
              )
            )
            ||
            ""

        })
      );


    /*
      Administrateur / Gestionnaire E1 :
      accès global.
    */

    if(
      hasGlobalAccess()
    ){

      state.filtered =
        state.contributions;


      const e1 =
        bureaux.find(
          b =>
            normalizeText(
              b.Code
            )
            ===
            "e1"
        );


      const paramBureauId =
        e1?.id
        ||
        state.bureauId;


      state.params =
        params.find(
          p =>
            Number(
              p.Bureau
            )
            ===
            Number(
              paramBureauId
            )
        )
        ||
        params[0]
        ||
        null;

    }


    /*
      Profil bureau :
      uniquement son bureau d'origine.
    */

    else if(
      state.bureauId
    ){

      state.filtered =
        state.contributions
          .filter(
            r =>
              Number(
                r.Bureau_origine
              )
              ===
              Number(
                state.bureauId
              )
          );


      state.params =
        params.find(
          p =>
            Number(
              p.Bureau
            )
            ===
            Number(
              state.bureauId
            )
        )
        ||
        null;

    }


    /*
      Cas de secours.
    */

    else{

      state.filtered =
        state.contributions;


      state.params =
        params[0]
        ||
        null;

    }


    /*
      ANCRE v62 :
      remplissage de tous les filtres.
    */

    populateSynthFilters();


    render();


    $("status")
      .textContent =
        "✓ Synthèse actualisée";


    setTimeout(
      () => {

        $("status")
          .textContent =
            "";

      },
      2200
    );


  }
  catch(error){

    showError(
      error
    );


    $("status")
      .textContent =
        "";

  }

}



/* =========================================

   ========================================= */

async function copySummary(){

  const text =
`À : ${$("recipients").value}

Objet : ${$("subject").value}

${$("body").value}`;


  try{

    await navigator
      .clipboard
      .writeText(
        text
      );


    $("status")
      .textContent =
        "✓ Synthèse copiée dans le presse-papiers";

  }
  catch(error){

    $("body")
      .focus();


    $("body")
      .select();


    document.execCommand(
      "copy"
    );


    $("status")
      .textContent =
        "✓ Message copié";

  }


  setTimeout(
    () => {

      $("status")
        .textContent =
          "";

    },
    2500
  );

}
